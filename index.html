.selector-btn:hover{color:#000}

.archive-list-container{display:none}

.board-grid .board-item:nth-child(odd){transform:rotate(-.5deg)}
.board-grid .board-item:nth-child(even){transform:rotate(.6deg)}

.image-wrapper[data-missing]::before{content:attr(data-missing);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:.8rem;color:#999;text-align:center}
.board-img{width:100%;height:100%;object-fit:cover;filter:grayscale(15%);display:block}
.board-meta{margin-top:15px;display:flex;justify-content:space-between;align-items:baseline;font-family:monospace;padding:0 4px}
.board-title{font-size:1.05rem;font-weight:bold;text-transform:uppercase}
.board-tag{font-size:.78rem;color:#666;text-transform:uppercase}

.project-page.active{display:block}
